name: C++ contract checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc, mode: debug }
          - { os: ubuntu-24.04, compiler: gcc, mode: release }
          - { os: ubuntu-24.04, compiler: clang, mode: debug }
          - { os: ubuntu-24.04, compiler: gcc, mode: asan }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          cmake --version
          "$CXX" --version
      - name: Build and run focused test targets
        run: |
          case "${{ matrix.mode }}" in
            debug) bash scripts/test.sh --rebuild --jobs 2 ;;
            release) bash scripts/test.sh --release --rebuild --jobs 2 ;;
            asan) bash scripts/test.sh --asan --rebuild --jobs 2 ;;
          esac
      - name: Archive test records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.compiler }}-${{ matrix.mode }}
          path: build/${{ matrix.mode == 'asan' && 'asan' || matrix.mode }}/Testing/Temporary/
          if-no-files-found: ignore
